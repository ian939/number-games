<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자놀이터 🔢 | 재미있는 숫자 게임 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ★ 새 게임 추가하는 방법 ★
   1) 만든 게임 HTML 파일을 이 폴더(numbers/)에 넣으세요.
   2) 아래 <script> 안의 GAMES 목록에 한 줄 추가하면 끝!
      예) { file:"my_game.html", title:"내 게임", emoji:"🎲",
            desc:"설명", color:"#4A90E2" },
   GitHub에 올리면(또는 push 하면) 바로 메인 화면에 반영됩니다.
   ===================================================================== */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-top: #2b2d6e;
    --bg-mid: #5b3a8e;
    --bg-bot: #c84db0;
    --ink: #2b2440;
    --paper: #fffdf7;
    --accent: #ffd23f;
  }

  html, body { width: 100%; min-height: 100%; }

  body {
    font-family: 'Gaegu', sans-serif;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  /* 떠다니는 숫자 장식 */
  .floaty {
    position: fixed;
    font-family: 'Jua', sans-serif;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.08);
    user-select: none;
    pointer-events: none;
    z-index: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }

  /* 헤더 */
  header { text-align: center; margin-bottom: 44px; }
  header .badge {
    display: inline-block;
    font-size: 14px;
    letter-spacing: 4px;
    background: rgba(255, 255, 255, 0.15);
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
  }
  header h1 {
    font-family: 'Jua', sans-serif;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    color: var(--accent);
    text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.25), 0 0 40px rgba(255, 210, 63, 0.4);
    line-height: 1.05;
  }
  header p {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    margin-top: 12px;
    color: rgba(255, 255, 255, 0.9);
  }

  /* 게임 카드 그리드 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    padding: 26px 22px 24px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 4px solid transparent;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: var(--card-color, #4A90E2);
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    border-color: var(--card-color, #4A90E2);
  }
  .card .emoji {
    font-size: 3.4rem;
    line-height: 1;
  }
  .card h2 {
    font-family: 'Jua', sans-serif;
    font-size: 1.55rem;
    color: var(--card-color, #4A90E2);
  }
  .card .desc {
    font-size: 1.05rem;
    color: #6b5d4f;
    flex-grow: 1;
  }
  .card .play {
    align-self: flex-start;
    margin-top: 6px;
    font-family: 'Jua', sans-serif;
    font-size: 1rem;
    color: #fff;
    background: var(--card-color, #4A90E2);
    padding: 8px 20px;
    border-radius: 999px;
  }
  .card .num-tag {
    position: absolute;
    top: 14px; right: 16px;
    font-family: 'Jua', sans-serif;
    font-size: 0.85rem;
    color: rgba(0, 0, 0, 0.18);
  }

  /* 게임이 없을 때 안내 */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    border: 2px dashed rgba(255, 255, 255, 0.3);
    border-radius: 24px;
    padding: 50px 20px;
    font-size: 1.3rem;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.6);
  }

  /* ── 도감보기 버튼 ── */
  .dex-open-btn{
    display:inline-flex;align-items:center;gap:10px;margin-top:20px;cursor:pointer;
    font-family:'Jua',sans-serif;font-size:1.15rem;color:var(--ink);
    background:var(--accent);border:none;border-radius:999px;padding:11px 24px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;
  }
  .dex-open-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,.4);}
  .dex-open-btn .egg-pill{background:rgba(0,0,0,.18);border-radius:999px;padding:2px 11px;font-size:1rem;}

  /* ── 모달 공통 ── */
  .overlay{position:fixed;inset:0;background:rgba(10,10,25,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px;}
  .overlay.show{display:flex;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

  /* ── 도감 모달 ── */
  .dex-card{background:#16213e;color:#e8e8e8;border:2px solid var(--accent);border-radius:22px;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .3s cubic-bezier(.34,1.56,.64,1);overflow:hidden;}
  .dex-card .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;gap:10px;}
  .dex-card .dh h2{font-family:'Jua',sans-serif;font-size:1.4rem;color:var(--accent);}
  .dex-close{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px;font-family:'Gaegu',sans-serif;}
  .dex-close:hover{background:rgba(255,255,255,.25);}
  .hatch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 18px 12px;flex-wrap:wrap;}
  .dex-stats{font-size:14px;color:#9ab;}
  .hatch-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;font-size:15px;color:#3a2e2a;background:var(--accent);border:none;border-radius:14px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .hatch-btn:disabled{filter:grayscale(.7);opacity:.55;cursor:default;box-shadow:none;}
  .dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;padding:8px 14px 16px;overflow-y:auto;}
  .dex-cell{background:#0f3460;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:4px;border:1px solid rgba(255,255,255,.06);min-height:90px;cursor:default;transition:border-color .15s,transform .12s;}
  .dex-cell.captured{border-color:rgba(255,210,63,.35);cursor:pointer;}
  .dex-cell.captured:hover{transform:scale(1.05);border-color:var(--accent);}
  .dex-sprite{width:54px;height:54px;image-rendering:pixelated;}
  .dex-sprite.silhouette{filter:brightness(0) opacity(.18);}
  .dex-num{font-size:11px;color:#9ab;}
  .dex-name{font-size:12px;color:#e8e8e8;text-align:center;}

  /* ── 부화 연출 ── */
  .egg-stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
  .egg-shake{animation:shake .5s ease-in-out!important;}
  @keyframes crack-flash{0%{filter:brightness(1)}30%{filter:brightness(2)}60%{filter:brightness(1.5)}100%{filter:brightness(1)}}
  .egg-crack{animation:crack-flash .6s ease-out!important;}

  /* ── 상세 모달 ── */
  .detail-card{background:linear-gradient(160deg,#1e3a6e,#0f3460);border:2px solid var(--accent);border-radius:22px;padding:24px 20px 20px;width:100%;max-width:340px;text-align:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .3s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto;}
  .detail-card .dm-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer;}
  .dm-sprite{width:130px;height:130px;image-rendering:pixelated;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
  .dm-num{font-size:12px;color:#9ab;}
  .dm-name{font-family:'Jua',sans-serif;font-size:1.5rem;color:var(--accent);}
  .dm-genus{font-size:13px;color:#9ab;margin-top:2px;}
  .rarity-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px;}
  .rarity-common{background:rgba(155,155,155,.2);color:#aaa;}
  .rarity-rare{background:rgba(59,107,206,.25);color:#7baaf7;}
  .rarity-epic{background:rgba(150,80,220,.25);color:#c084fc;}
  .rarity-legend{background:rgba(255,203,5,.2);color:var(--accent);}
  .dm-types{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px;min-height:30px;}
  .type-badge{padding:5px 16px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;font-family:'Jua',sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.45);}
  .dm-desc{font-size:13.5px;line-height:1.75;color:#e8e8e8;background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px;margin-top:10px;min-height:42px;}
  .dm-desc.loading{color:#9ab;font-style:italic;}

  #hub-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#16213e;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;border:1px solid rgba(255,255,255,.15);opacity:0;transition:all .3s;pointer-events:none;z-index:3000;}
  #hub-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <span class="badge">N U M B E R S</span>
      <h1>숫자놀이터 🔢</h1>
      <p>재미있게 숫자랑 놀아볼까요? 게임을 골라보세요!</p>
      <button class="dex-open-btn" id="dexOpenBtn" onclick="openDex()">📖 도감보기 <span class="egg-pill" id="eggPill">🥚 0</span></button>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      <span id="count"></span> · 새 게임은 폴더에 HTML을 넣고 목록에 추가하면 자동으로 나타나요 ✨
    </footer>
  </div>

  <!-- 도감 모달 -->
  <div class="overlay" id="dex-modal" onclick="if(event.target===this)closeDex()">
    <div class="dex-card">
      <div class="dh">
        <h2>📖 포켓몬 도감</h2>
        <button class="dex-close" onclick="closeDex()">닫기 ✕</button>
      </div>
      <div class="hatch-row">
        <div class="dex-stats" id="dexStats">0 / 151 마리</div>
        <button class="hatch-btn" id="hatchBtn" onclick="doHatch()">🥚 알 부화하기 (<span id="hatchCount">0</span>)</button>
      </div>
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </div>

  <!-- 부화 연출 모달 -->
  <div class="overlay" id="hatch-modal">
    <div class="detail-card">
      <div class="egg-stage">
        <svg class="egg-svg" id="eggSvg" width="120" height="140" viewBox="0 0 120 140">
          <ellipse cx="60" cy="75" rx="46" ry="58" fill="#f5f0e0" stroke="#d4c89a" stroke-width="3"/>
          <ellipse cx="48" cy="55" rx="10" ry="14" fill="rgba(255,255,255,0.5)" transform="rotate(-20,48,55)"/>
        </svg>
        <div style="font-family:'Jua',sans-serif;color:var(--accent);">알에서 무엇이 나올까요?</div>
      </div>
    </div>
  </div>

  <!-- 상세 모달 -->
  <div class="overlay" id="detail-modal" onclick="if(event.target===this)closeDetail()">
    <div class="detail-card">
      <button class="dm-close" onclick="closeDetail()" aria-label="닫기">✕</button>
      <img class="dm-sprite" id="dmSprite" src="" alt="">
      <div class="dm-num" id="dmNum"></div>
      <div class="dm-name" id="dmName"></div>
      <div class="dm-genus" id="dmGenus"></div>
      <div><span class="rarity-badge" id="dmRarity"></span></div>
      <div class="dm-types" id="dmTypes"></div>
      <p class="dm-desc" id="dmDesc"></p>
      <div id="dmActions" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="hub-toast"></div>

<script src="hub.js"></script>
<script>
  /* =====================================================================
     게임 목록 — 여기에만 추가하면 메인 화면에 카드가 생깁니다.
     file  : 같은 폴더 안의 HTML 파일 이름
     title : 카드에 보일 제목
     emoji : 큰 아이콘 (이모지)
     desc  : 짧은 설명
     color : 카드 강조 색상
     ===================================================================== */
  const GAMES = [
    {
      file: "math_game.html",
      title: "블록 더하기",
      emoji: "🧱",
      desc: "블록을 쌓아서 더하기를 배워요. 10개씩 묶어 자릿값도 익혀요!",
      color: "#4A90E2"
    },
    {
      file: "pokemon_math_game.html",
      title: "포켓몬 수학",
      emoji: "⚡",
      desc: "포켓몬과 함께 더하기·빼기 모험을 떠나요. 도감도 모아보자!",
      color: "#e3350d"
    },
    {
      file: "ten-maker-game.html",
      title: "10 만들기 대모험",
      emoji: "🔟",
      desc: "여우랑 10을 만들어 받아올림 덧셈을 익혀요! 5단계 모험.",
      color: "#ff6b6b"
    },
    // ↓↓↓ 새 게임을 여기에 추가하세요 ↓↓↓
  ];

  /* ---- 화면 그리기 ---- */
  const grid = document.getElementById("grid");
  const palette = ["#4A90E2", "#e3350d", "#7CC576", "#ffb300", "#9c5fd1", "#ff6b9d"];

  if (GAMES.length === 0) {
    grid.innerHTML = '<div class="empty">아직 게임이 없어요!<br>HTML 파일을 폴더에 넣고 목록에 추가해 주세요 🙂</div>';
  } else {
    GAMES.forEach((g, i) => {
      const color = g.color || palette[i % palette.length];
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.file;
      a.style.setProperty("--card-color", color);
      a.innerHTML = `
        <span class="num-tag">#${String(i + 1).padStart(2, "0")}</span>
        <span class="emoji">${g.emoji || "🔢"}</span>
        <h2>${g.title}</h2>
        <p class="desc">${g.desc || ""}</p>
        <span class="play">시작하기 ▶</span>
      `;
      grid.appendChild(a);
    });
  }

  document.getElementById("count").textContent = `게임 ${GAMES.length}개`;

  /* ---- 배경 숫자 장식 ---- */
  const digits = "0123456789+-×÷=";
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "floaty";
    s.textContent = digits[Math.floor(Math.random() * digits.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (Math.random() * 60 + 30) + "px";
    s.style.animationDuration = (Math.random() * 25 + 20) + "s";
    s.style.animationDelay = (-Math.random() * 30) + "s";
    document.body.appendChild(s);
  }

  /* =====================================================================
     도감 / 부화 / 상세보기 — 공용 알·도감(hub.js)을 여기서 관리
     ===================================================================== */
  function updateEggUI(){
    const e = Hub.getEggs();
    document.getElementById("eggPill").textContent = "🥚 " + e;
    const hc = document.getElementById("hatchCount");
    if (hc) hc.textContent = e;
    const hb = document.getElementById("hatchBtn");
    if (hb) hb.disabled = e <= 0;
  }

  function openDex(){ renderDex(); updateEggUI(); document.getElementById("dex-modal").classList.add("show"); }
  function closeDex(){ document.getElementById("dex-modal").classList.remove("show"); }

  function renderDex(){
    const grid = document.getElementById("dexGrid");
    grid.innerHTML = "";
    const caught = Hub.state.caught;
    document.getElementById("dexStats").textContent = Hub.caughtCount() + " / 151 마리";
    for (let id = 1; id <= 151; id++){
      const has = caught[id];
      const cell = document.createElement("div");
      cell.className = "dex-cell" + (has ? " captured" : "");
      const img = document.createElement("img");
      img.className = "dex-sprite" + (has ? "" : " silhouette");
      img.src = Hub.SPRITE(id); img.alt = Hub.POKEMON_KR[id] || ""; img.loading = "lazy";
      const num = document.createElement("div");
      num.className = "dex-num"; num.textContent = "#" + String(id).padStart(3, "0");
      const name = document.createElement("div");
      name.className = "dex-name"; name.textContent = has ? Hub.POKEMON_KR[id] : "???";
      cell.append(img, num, name);
      if (has && caught[id] > 1){
        const c2 = document.createElement("div");
        c2.className = "dex-num"; c2.textContent = "x" + caught[id];
        cell.appendChild(c2);
      }
      if (has){
        cell.title = Hub.POKEMON_KR[id] + " 상세보기";
        cell.onclick = () => openDetail(id, {});
      }
      grid.appendChild(cell);
    }
  }

  function doHatch(){
    if (Hub.getEggs() <= 0){ hubToast("알이 없어요! 게임에서 점수를 모아보세요."); return; }
    const svg = document.getElementById("eggSvg");
    document.getElementById("hatch-modal").classList.add("show");
    svg.classList.remove("egg-shake", "egg-crack");
    void svg.offsetWidth;
    svg.classList.add("egg-shake");
    setTimeout(() => {
      svg.classList.add("egg-crack");
      setTimeout(() => {
        const id = Hub.hatch();
        document.getElementById("hatch-modal").classList.remove("show");
        renderDex(); updateEggUI();
        if (id != null) openDetail(id, { hatched: true });
      }, 500);
    }, 500);
  }

  let detailToken = 0;
  function openDetail(id, opts){
    opts = opts || {};
    detailToken++; const token = detailToken;
    const r = Hub.RARITY(id);
    document.getElementById("dmSprite").src = Hub.SPRITE(id);
    document.getElementById("dmSprite").alt = Hub.POKEMON_KR[id] || "";
    document.getElementById("dmNum").textContent = "#" + String(id).padStart(3, "0");
    document.getElementById("dmName").textContent = Hub.POKEMON_KR[id] || "???";
    const rb = document.getElementById("dmRarity");
    rb.className = "rarity-badge " + r.cls; rb.textContent = r.label;
    const genusEl = document.getElementById("dmGenus"); genusEl.textContent = "";
    const typesEl = document.getElementById("dmTypes"); typesEl.innerHTML = "";
    const descEl = document.getElementById("dmDesc");
    descEl.className = "dm-desc loading"; descEl.textContent = "설명을 불러오는 중…";
    const actions = document.getElementById("dmActions"); actions.innerHTML = "";
    if (opts.hatched){
      const again = document.createElement("button");
      again.className = "hatch-btn"; again.textContent = "한 번 더 🥚";
      again.disabled = Hub.getEggs() <= 0;
      again.onclick = () => { closeDetail(); doHatch(); };
      actions.appendChild(again);
    }
    document.getElementById("detail-modal").classList.add("show");
    Hub.fetchDetail(id).then(d => {
      if (token !== detailToken) return;
      renderTypes(typesEl, d.types);
      genusEl.textContent = d.genus || "";
      descEl.className = "dm-desc"; descEl.textContent = d.flavor || "설명 정보가 없어요.";
    }).catch(() => {
      if (token !== detailToken) return;
      descEl.className = "dm-desc";
      descEl.textContent = "설명을 불러오지 못했어요. (인터넷 연결을 확인해 주세요)";
    });
  }
  function renderTypes(el, types){
    el.innerHTML = "";
    (types || []).forEach(t => {
      const info = Hub.TYPE_KR[t] || { label: t, color: "#777" };
      const b = document.createElement("span");
      b.className = "type-badge"; b.style.background = info.color;
      b.textContent = info.label + "타입";
      el.appendChild(b);
    });
  }
  function closeDetail(){ document.getElementById("detail-modal").classList.remove("show"); }

  let hubToastT;
  function hubToast(msg){
    const t = document.getElementById("hub-toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(hubToastT);
    hubToastT = setTimeout(() => t.classList.remove("show"), 2500);
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (document.getElementById("detail-modal").classList.contains("show")) closeDetail();
    else if (document.getElementById("dex-modal").classList.contains("show")) closeDex();
  });

  updateEggUI();
  if (location.hash === "#dex") openDex();
</script>
</body>
</html>
