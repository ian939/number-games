<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자놀이터 🔢 | 재미있는 숫자 게임 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ★ 새 게임 추가하는 방법 ★
   1) 만든 게임 HTML 파일을 이 폴더(numbers/)에 넣으세요.
   2) 아래 <script> 안의 GAMES 목록에 한 줄 추가하면 끝!
      예) { file:"my_game.html", title:"내 게임", emoji:"🎲",
            desc:"설명", color:"#4A90E2" },
   GitHub에 올리면(또는 push 하면) 바로 메인 화면에 반영됩니다.
   ===================================================================== */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-top: #2b2d6e;
    --bg-mid: #5b3a8e;
    --bg-bot: #c84db0;
    --ink: #2b2440;
    --paper: #fffdf7;
    --accent: #ffd23f;
  }

  html, body { width: 100%; min-height: 100%; }

  body {
    font-family: 'Gaegu', sans-serif;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  /* 떠다니는 숫자 장식 */
  .floaty {
    position: fixed;
    font-family: 'Jua', sans-serif;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.08);
    user-select: none;
    pointer-events: none;
    z-index: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }

  /* 헤더 */
  header { text-align: center; margin-bottom: 44px; }
  header .badge {
    display: inline-block;
    font-size: 14px;
    letter-spacing: 4px;
    background: rgba(255, 255, 255, 0.15);
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
  }
  header h1 {
    font-family: 'Jua', sans-serif;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    color: var(--accent);
    text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.25), 0 0 40px rgba(255, 210, 63, 0.4);
    line-height: 1.05;
  }
  header p {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    margin-top: 12px;
    color: rgba(255, 255, 255, 0.9);
  }

  /* 게임 카드 그리드 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 24px;
    padding: 26px 22px 24px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 4px solid transparent;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: var(--card-color, #4A90E2);
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    border-color: var(--card-color, #4A90E2);
  }
  .card .emoji {
    font-size: 3.4rem;
    line-height: 1;
  }
  .card h2 {
    font-family: 'Jua', sans-serif;
    font-size: 1.55rem;
    color: var(--card-color, #4A90E2);
  }
  .card .desc {
    font-size: 1.05rem;
    color: #6b5d4f;
    flex-grow: 1;
  }
  .card .play {
    align-self: flex-start;
    margin-top: 6px;
    font-family: 'Jua', sans-serif;
    font-size: 1rem;
    color: #fff;
    background: var(--card-color, #4A90E2);
    padding: 8px 20px;
    border-radius: 999px;
  }
  .card .num-tag {
    position: absolute;
    top: 14px; right: 16px;
    font-family: 'Jua', sans-serif;
    font-size: 0.85rem;
    color: rgba(0, 0, 0, 0.18);
  }

  /* 게임이 없을 때 안내 */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    border: 2px dashed rgba(255, 255, 255, 0.3);
    border-radius: 24px;
    padding: 50px 20px;
    font-size: 1.3rem;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.6);
  }

  /* ── 도감보기 버튼 ── */
  .dex-open-btn{
    display:inline-flex;align-items:center;gap:10px;margin-top:20px;cursor:pointer;
    font-family:'Jua',sans-serif;font-size:1.15rem;color:var(--ink);
    background:var(--accent);border:none;border-radius:999px;padding:11px 24px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s;
  }
  .dex-open-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,.4);}
  .dex-open-btn .egg-pill{background:rgba(0,0,0,.18);border-radius:999px;padding:2px 11px;font-size:1rem;}

  /* 카드의 게임별 점수 */
  .card-score{align-self:flex-start;font-family:'Jua',sans-serif;font-size:.95rem;color:#8a7a5a;background:rgba(255,210,63,.18);border:1px solid rgba(255,179,0,.35);border-radius:999px;padding:3px 12px;}

  /* 도감/부화/상세 모달은 hub.js가 주입(hub- 클래스) */
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <span class="badge">N U M B E R S</span>
      <h1>숫자놀이터 🔢</h1>
      <p>재미있게 숫자랑 놀아볼까요? 게임을 골라보세요!</p>
      <button class="dex-open-btn" id="dexOpenBtn" onclick="openDex()">📖 도감보기 <span class="egg-pill" id="eggPill">🥚 0</span></button>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      <span id="count"></span> · 새 게임은 폴더에 HTML을 넣고 목록에 추가하면 자동으로 나타나요 ✨
    </footer>
  </div>

<script src="hub.js"></script>
<script>
  /* =====================================================================
     게임 목록 — 여기에만 추가하면 메인 화면에 카드가 생깁니다.
     file  : 같은 폴더 안의 HTML 파일 이름
     title : 카드에 보일 제목
     emoji : 큰 아이콘 (이모지)
     desc  : 짧은 설명
     color : 카드 강조 색상
     ===================================================================== */
  const GAMES = [
    {
      file: "math_game.html",
      gameId: "block",
      title: "블록 더하기",
      emoji: "🧱",
      desc: "블록을 쌓아서 더하기를 배워요. 10개씩 묶어 자릿값도 익혀요!",
      color: "#4A90E2"
    },
    {
      file: "pokemon_math_game.html",
      gameId: "pokemon",
      title: "포켓몬 수학",
      emoji: "⚡",
      desc: "포켓몬과 함께 더하기·빼기 모험을 떠나요. 도감도 모아보자!",
      color: "#e3350d"
    },
    {
      file: "ten-maker-game.html",
      gameId: "ten",
      title: "피카츄의 10 만들기 대모험",
      emoji: "⚡",
      desc: "피카츄랑 10을 만들어 받아올림 덧셈을 익혀요! 5단계 모험.",
      color: "#ffcb05"
    },
    // ↓↓↓ 새 게임을 여기에 추가하세요 (gameId: hub.js 점수 적립용 키) ↓↓↓
  ];

  /* ---- 화면 그리기 ---- */
  const grid = document.getElementById("grid");
  const palette = ["#4A90E2", "#e3350d", "#7CC576", "#ffb300", "#9c5fd1", "#ff6b9d"];

  if (GAMES.length === 0) {
    grid.innerHTML = '<div class="empty">아직 게임이 없어요!<br>HTML 파일을 폴더에 넣고 목록에 추가해 주세요 🙂</div>';
  } else {
    GAMES.forEach((g, i) => {
      const color = g.color || palette[i % palette.length];
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.file;
      a.style.setProperty("--card-color", color);
      a.innerHTML = `
        <span class="num-tag">#${String(i + 1).padStart(2, "0")}</span>
        <span class="emoji">${g.emoji || "🔢"}</span>
        <h2>${g.title}</h2>
        <p class="desc">${g.desc || ""}</p>
        ${g.gameId ? `<span class="card-score" data-game="${g.gameId}">⭐ 총 0점</span>` : ""}
        <span class="play">시작하기 ▶</span>
      `;
      grid.appendChild(a);
    });
  }

  document.getElementById("count").textContent = `게임 ${GAMES.length}개`;

  /* ---- 배경 숫자 장식 ---- */
  const digits = "0123456789+-×÷=";
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "floaty";
    s.textContent = digits[Math.floor(Math.random() * digits.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (Math.random() * 60 + 30) + "px";
    s.style.animationDuration = (Math.random() * 25 + 20) + "s";
    s.style.animationDelay = (-Math.random() * 30) + "s";
    document.body.appendChild(s);
  }

  /* =====================================================================
     도감/부화는 hub.js의 공용 모달(Hub.openDex)을 사용 — 점수만 여기서 표시
     ===================================================================== */
  function openDex(){ Hub.openDex(); }   // [도감보기] 버튼

  function updateScores(){
    const avail = Hub.available();
    const pill = document.getElementById("eggPill");
    if (pill) pill.textContent = "🥚 " + avail + "점";
    document.querySelectorAll(".card-score[data-game]").forEach(el => {
      el.textContent = "⭐ 총 " + Hub.gameScore(el.dataset.game) + "점";
    });
  }

  document.addEventListener("hubchange", updateScores);
  updateScores();
  if (location.hash === "#dex") Hub.openDex();
</script>
</body>
</html>
